basePath: /
definitions:
  ast.Reason:
    properties:
      detail:
        description: human-readable cause, including the actual value
        type: string
      expr:
        description: the failing predicate / group, in SQL form
        type: string
    type: object
  engine.Version:
    properties:
      count:
        type: integer
      note:
        type: string
      rules:
        items:
          $ref: '#/definitions/model.Rule'
        type: array
      time:
        type: string
      version:
        type: integer
    type: object
  model.Rule:
    properties:
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      priority:
        description: higher sorts first
        type: integer
      rule:
        type: string
      version:
        description: monotonic per-rule revision (0 = unset)
        type: integer
    type: object
  router.DeleteResponse:
    properties:
      id:
        example: 1001
        type: integer
      ok:
        example: true
        type: boolean
      rules:
        example: 10
        type: integer
    type: object
  router.ErrorResponse:
    properties:
      error:
        example: 'bad rule json: unexpected end of JSON input'
        type: string
    type: object
  router.EvaluateRequest:
    properties:
      row:
        allOf:
        - $ref: '#/definitions/router.UserRow'
        description: The wide-table user row to evaluate.
      rule:
        description: 'SQL rule text. Optional: defaults to the built-in flagship rule
          when empty.'
        example: age BETWEEN 25 AND 40 AND province IN ('广东','江苏','浙江') AND active_score
          >= 85
        type: string
      rule_id:
        description: 'Optional: explain an already-loaded rule by its ID (used only
          when "rule" is empty).'
        example: 0
        type: integer
    type: object
  router.EvaluateResponse:
    properties:
      passed:
        example: false
        type: boolean
      reasons:
        items:
          $ref: '#/definitions/ast.Reason'
        type: array
      rule:
        example: age BETWEEN 25 AND 40 AND active_score >= 85
        type: string
    type: object
  router.HealthResponse:
    properties:
      ok:
        example: true
        type: boolean
      rules:
        example: 10
        type: integer
    type: object
  router.MatchResponse:
    properties:
      hits:
        example: 2
        type: integer
      rule_ids:
        items:
          type: integer
        type: array
      rule_names:
        items:
          type: string
        type: array
      took_ms:
        example: 0.123
        type: number
      uid:
        example: 1
        type: integer
    type: object
  router.Ping2Response:
    properties:
      ping:
        example: pong2
        type: string
    type: object
  router.PublishRequest:
    properties:
      note:
        example: 上线 618 大促规则集
        type: string
    type: object
  router.PublishResponse:
    properties:
      count:
        example: 10
        type: integer
      version:
        example: 1
        type: integer
    type: object
  router.RollbackResponse:
    properties:
      ok:
        example: true
        type: boolean
      rules:
        example: 10
        type: integer
      version:
        example: 1
        type: integer
    type: object
  router.RuleCountResponse:
    properties:
      rules:
        example: 10
        type: integer
    type: object
  router.RuleInput:
    properties:
      enabled:
        example: true
        type: boolean
      id:
        example: 1001
        type: integer
      name:
        example: 电商精准营销-广东高价值男性
        type: string
      priority:
        example: 10
        type: integer
      rule:
        example: gender = '男' AND age BETWEEN 25 AND 35 AND province = '广东' AND vip_level
          >= 3 AND total_amount >= 10000
        type: string
      version:
        example: 0
        type: integer
    type: object
  router.RuleListResponse:
    properties:
      rules:
        items:
          $ref: '#/definitions/model.Rule'
        type: array
    type: object
  router.RuleTestRequest:
    properties:
      row:
        $ref: '#/definitions/router.UserRow'
      rule:
        example: age >= 30 AND vip_level >= 2 AND total_amount > 5000
        type: string
    type: object
  router.RuleTestResponse:
    properties:
      matched:
        example: true
        type: boolean
    type: object
  router.SelfTestRequest:
    properties:
      row:
        $ref: '#/definitions/router.UserRow'
      rule:
        example: age BETWEEN 25 AND 40 AND vip_level >= 3 AND active_score >= 85
        type: string
    type: object
  router.SelfTestResponse:
    properties:
      added_rule_id:
        example: 990001
        type: integer
      live_add_ok:
        example: true
        type: boolean
      live_remove_ok:
        example: true
        type: boolean
      rule:
        type: string
      sample_user:
        additionalProperties: {}
        type: object
      steps:
        items:
          $ref: '#/definitions/router.SelfTestStep'
        type: array
    type: object
  router.SelfTestStep:
    properties:
      matched:
        items:
          type: integer
        type: array
      rules:
        example: 11
        type: integer
      step:
        example: after_add
        type: string
    type: object
  router.UpsertResponse:
    properties:
      id:
        example: 1001
        type: integer
      ok:
        example: true
        type: boolean
      rules:
        example: 11
        type: integer
    type: object
  router.UserRow:
    properties:
      active_score:
        example: 91.52
        type: number
      age:
        example: 28
        type: integer
      avg_order_amount:
        example: 269.91
        type: number
      city:
        example: 深圳
        type: string
      credit_score:
        example: 765
        type: integer
      device_type:
        example: iPhone
        type: string
      favorite_category:
        example: 数码
        type: string
      gender:
        example: 男
        type: string
      income_level:
        example: 20k-30k
        type: string
      login_days_30d:
        example: 28
        type: integer
      occupation:
        example: 程序员
        type: string
      order_count:
        example: 132
        type: integer
      province:
        example: 广东
        type: string
      register_days:
        example: 620
        type: integer
      risk_level:
        example: 低
        type: string
      total_amount:
        example: 35628.56
        type: number
      uid:
        example: 1
        type: integer
      username:
        example: user001
        type: string
      vip_level:
        example: 3
        type: integer
    type: object
  router.VersionListResponse:
    properties:
      versions:
        items:
          $ref: '#/definitions/engine.Version'
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: AIRuleX 实时规则引擎 HTTP 接口：在线评分（/match、/match/batch、/evaluate）、规则热更新（/rules*）与版本管理（/versions*）。请求/响应示例取自
    data/users.json 与 data/rules.json。
  title: AIRuleX 规则引擎 API
  version: "2.0"
paths:
  /:
    get:
      description: 返回运维控制台 Web 页面（HTML），用于在线增删改查 / 测试 / 发布规则。
      operationId: editor
      produces:
      - text/html
      responses:
        "200":
          description: HTML 页面
          schema:
            type: string
      summary: 规则编辑器控制台
      tags:
      - Console
  /evaluate:
    post:
      consumes:
      - application/json
      description: |-
        将一个宽表用户行在单条规则树上求值，返回是否通过 passed，以及导致未通过的谓词原因列表 reasons（passed=true 时为空）。
        - rule：可选，SQL 规则文本；省略时使用内置 flagship 规则
        - rule_id：可选，对已加载的规则按 ID 取其表达式进行解释（仅当 rule 为空时生效）
        - row：宽表用户字段
      operationId: evaluate
      parameters:
      - description: 评估请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.EvaluateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 评估结果（passed + reasons）
          schema:
            $ref: '#/definitions/router.EvaluateResponse'
        "400":
          description: JSON 解析或规则解析失败
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: rule_id 未加载
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 单规则评估并解释
      tags:
      - Scoring
  /healthz:
    get:
      description: 返回服务存活状态与当前已编译规则数。
      operationId: health_check
      produces:
      - application/json
      responses:
        "200":
          description: 服务正常
          schema:
            $ref: '#/definitions/router.HealthResponse'
      summary: 健康检查
      tags:
      - System
  /match:
    post:
      consumes:
      - application/json
      description: 传入一个宽表用户对象（任意列，见 data/users.json 样例），返回命中的规则 ID、规则名与耗时。并发受引擎信号量限制，超出将排队。
      operationId: match_single
      parameters:
      - description: 宽表用户对象（允许任意附加字段）
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/router.UserRow'
      produces:
      - application/json
      responses:
        "200":
          description: 命中结果
          schema:
            $ref: '#/definitions/router.MatchResponse'
        "400":
          description: 请求体 JSON 解析失败
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 单用户实时评分
      tags:
      - Scoring
  /match/batch:
    post:
      consumes:
      - application/json
      description: 传入用户对象数组（顶层 JSON 数组），按顺序返回每个用户的命中结果。整批受引擎并发上限约束。
      operationId: match_batch
      parameters:
      - description: 用户对象数组
        in: body
        name: users
        required: true
        schema:
          items:
            $ref: '#/definitions/router.UserRow'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: 逐用户命中结果
          schema:
            items:
              $ref: '#/definitions/router.MatchResponse'
            type: array
        "400":
          description: 请求体 JSON 解析失败
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 批量用户实时评分
      tags:
      - Scoring
  /metrics:
    get:
      description: 以 Prometheus 文本曝光格式输出引擎指标：规则数、版本数、在判用户数、并发上限，以及最近窗口的 /match 延迟分位（p50/p90/p99）。
      operationId: metrics
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus 文本格式指标
          schema:
            type: string
      summary: Prometheus 指标
      tags:
      - System
  /ping2:
    get:
      description: 轻量存活探针，固定返回 {"ping":"pong2"}。
      operationId: ping
      produces:
      - application/json
      responses:
        "200":
          description: pong2
          schema:
            $ref: '#/definitions/router.Ping2Response'
      summary: 存活探针
      tags:
      - System
  /rules:
    get:
      description: 返回当前引擎已加载并编译的规则总数。
      operationId: rule_count
      produces:
      - application/json
      responses:
        "200":
          description: 规则总数
          schema:
            $ref: '#/definitions/router.RuleCountResponse'
      summary: 规则数量
      tags:
      - System
    post:
      consumes:
      - application/json
      description: 新增或按 ID 更新一条规则并即时生效（原子重建缓存）。表达式字段名为 "rule"（SQL 文本）。
      operationId: rule_upsert
      parameters:
      - description: 规则对象
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/router.RuleInput'
      produces:
      - application/json
      responses:
        "200":
          description: 写入成功，返回规则总数
          schema:
            $ref: '#/definitions/router.UpsertResponse'
        "400":
          description: 规则 JSON 非法或编译失败
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 新增 / 更新规则（热生效）
      tags:
      - Rules
  /rules/{id}:
    delete:
      description: 按 ID 删除规则并即时生效。
      operationId: rule_delete
      parameters:
      - description: 规则 ID
        example: 1001
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功，返回规则总数
          schema:
            $ref: '#/definitions/router.DeleteResponse'
        "400":
          description: ID 非法
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 删除规则（热生效）
      tags:
      - Rules
  /rules/list:
    get:
      description: 返回当前可编辑的全部规则。
      operationId: rule_list
      produces:
      - application/json
      responses:
        "200":
          description: 规则列表
          schema:
            $ref: '#/definitions/router.RuleListResponse'
      summary: 规则列表
      tags:
      - Rules
  /rules/selftest:
    post:
      consumes:
      - application/json
      description: 对运行中的引擎证明复杂规则的热增 / 热删：评分 → 热加规则（应命中）→ 热删规则（应消失），返回逐步轨迹与两个布尔证明。rule
        与 row 均可省略（使用内置 flagship 规则与样例）。
      operationId: rule_selftest
      parameters:
      - description: 可选：自定义规则与样例行
        in: body
        name: body
        schema:
          $ref: '#/definitions/router.SelfTestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 自检结果与轨迹
          schema:
            $ref: '#/definitions/router.SelfTestResponse'
        "400":
          description: 规则解析或热加失败
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 规则热增删自检
      tags:
      - Rules
  /rules/test:
    post:
      consumes:
      - application/json
      description: 不落库地用一行样例数据测试一条草稿规则是否命中。
      operationId: rule_test
      parameters:
      - description: 草稿规则 + 样例行
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.RuleTestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 是否命中
          schema:
            $ref: '#/definitions/router.RuleTestResponse'
        "400":
          description: JSON 非法或规则编译失败
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 草稿规则试算
      tags:
      - Rules
  /versions:
    get:
      description: 返回已发布的规则集版本快照列表。
      operationId: version_list
      produces:
      - application/json
      responses:
        "200":
          description: 版本列表
          schema:
            $ref: '#/definitions/router.VersionListResponse'
      summary: 版本快照列表
      tags:
      - Versions
    post:
      consumes:
      - application/json
      description: 对当前规则集打一个版本快照，可附带备注 note。
      operationId: version_publish
      parameters:
      - description: 可选备注
        in: body
        name: body
        schema:
          $ref: '#/definitions/router.PublishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 新版本号与规则数
          schema:
            $ref: '#/definitions/router.PublishResponse'
      summary: 发布版本快照
      tags:
      - Versions
  /versions/{v}/rollback:
    post:
      description: 将规则集回滚到指定版本快照并即时生效。
      operationId: version_rollback
      parameters:
      - description: 目标版本号
        example: 1
        in: path
        name: v
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 回滚成功
          schema:
            $ref: '#/definitions/router.RollbackResponse'
        "400":
          description: 版本号非法
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: 版本不存在
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: 回滚到指定版本
      tags:
      - Versions
schemes:
- http
swagger: "2.0"
